version: 2

builds:
  - main: ./cmd/sysmon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - config.example.yaml
      - systemd/sysmon.service

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
